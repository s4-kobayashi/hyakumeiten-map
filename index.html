<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食べログ 100名店マップ - スイーツ強化版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --vermillion: #C0392B;
    --gold: #C9A84C;
    --ink: #1A1209;
    --warm-white: #FAF7F2;
    --pale-gold: #F5E6C8;
    --sweets-pink: #D46A9B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--ink);
    padding: 10px 15px;
    border-bottom: 2px solid var(--gold);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 1000;
  }
  .header-title h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1rem;
    color: var(--warm-white);
  }
  .header-controls { display: flex; gap: 8px; align-items: center; }
  .search-bar {
    display: flex;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--gold);
    border-radius: 4px;
  }
  #search-input {
    background: transparent;
    border: none;
    color: white;
    padding: 6px;
    width: 130px;
    font-size: 0.8rem;
    outline: none;
  }
  button {
    background: var(--vermillion);
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer;
    font-weight: 600;
  }
  .main { flex: 1; display: flex; overflow: hidden; }
  #map { flex: 1; }
  #sidebar {
    width: 340px;
    background: var(--warm-white);
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--gold);
  }
  .sidebar-header { padding: 12px; border-bottom: 1px solid #ddd; background: var(--pale-gold); }
  #restaurant-list { flex: 1; overflow-y: auto; }
  .restaurant-card {
    padding: 12px 15px;
    border-bottom: 1px solid #ddd;
    cursor: pointer;
  }
  .restaurant-card:hover { background: #f2ede4; }
  .restaurant-card.active {
    background: var(--pale-gold);
    border-left: 4px solid var(--vermillion);
    box-shadow: 0 2px 8px rgba(192,57,43,0.15);
  }
  .card-name { font-weight: bold; font-size: 0.9rem; color: var(--ink); margin-bottom: 3px; }
  .card-info { font-size: 0.75rem; color: #555; }
  .score { color: var(--vermillion); font-weight: bold; }
  .cat-tag {
    display: inline-block;
    background: var(--ink);
    color: white;
    font-size: 0.6rem;
    padding: 1px 5px;
    border-radius: 3px;
    margin-right: 4px;
  }
  .cat-sweets { background: var(--sweets-pink) !important; }

  @media (max-width: 640px) {
    .main { flex-direction: column; }
    #map { height: 45vh; }
    #sidebar { width: 100%; height: 55vh; border-left: none; border-top: 2px solid var(--gold); }
    #search-input { width: 90px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-title"><h1>100名店MAP</h1></div>
  <div class="header-controls">
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="場所・駅名...">
      <button onclick="executeSearch()" style="background:var(--gold)">検索</button>
    </div>
    <button onclick="locateUser()">現在地</button>
  </div>
</header>

<div class="main">
  <div id="map"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <div id="status-title" style="font-weight:700; font-size:0.85rem;">付近の100名店</div>
      <div id="result-count" style="font-size:0.7rem; color:#666;">半径1km以内を表示</div>
    </div>
    <div id="restaurant-list"></div>
  </div>
</div>

<script>
const map = L.map('map').setView([35.6812, 139.7671], 14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

let markers = [];
let circleLayer = null;

function getDist(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI / 180;
  const dLon = (lon2-lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateUI(lat, lng, label = "指定地点") {
  map.setView([lat, lng], 15);
  const listEl = document.getElementById('restaurant-list');
  listEl.innerHTML = '';
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (circleLayer) { map.removeLayer(circleLayer); circleLayer = null; }
  circleLayer = L.circle([lat, lng], {
    radius: 1000,
    color: '#C0392B',
    fillColor: '#C0392B',
    fillOpacity: 0.07,
    weight: 2,
    dashArray: '6,4'
  }).addTo(map);

  const nearby = TABELOG_100_DB
    .map(r => ({ ...r, d: getDist(lat, lng, r.lat, r.lng) }))
    .filter(r => r.d <= 1.0)
    .sort((a, b) => b.score - a.score);

  document.getElementById('status-title').textContent = `${label} 周辺の100名店`;
  document.getElementById('result-count').textContent = `1km以内に ${nearby.length} 件`;

  const cards = [];

  function activateItem(idx) {
    cards.forEach(c => c.classList.remove('active'));
    if (cards[idx]) {
      cards[idx].classList.add('active');
      cards[idx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    if (markers[idx]) {
      markers[idx].openPopup();
    }
  }

  nearby.forEach((r, idx) => {
    const card = document.createElement('div');
    card.className = 'restaurant-card';
    const catClass = r.cat === 'スイーツ' ? 'cat-sweets' : '';
    card.innerHTML = `
      <div class="card-name">${r.name}</div>
      <div class="card-info">
        <span class="score">★${r.score.toFixed(2)}</span> <span class="cat-tag ${catClass}">${r.cat}</span><br>
        <span style="color:var(--vermillion);">約${Math.round(r.d*1000)}m</span> / ${r.addr}
      </div>
    `;
    card.onclick = () => {
      map.panTo([r.lat, r.lng]);
      activateItem(idx);
    };
    listEl.appendChild(card);
    cards.push(card);

    const m = L.marker([r.lat, r.lng]).addTo(map).bindPopup(`<b>${r.name}</b><br>★${r.score}`);
    m.on('click', () => {
      activateItem(idx);
    });
    markers.push(m);
  });
}

async function executeSearch() {
  const q = document.getElementById('search-input').value;
  if(!q) return;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`, {
      headers: { 'User-Agent': 'TabelogMapApp/1.0' }
    });
    const data = await res.json();
    if(data.length > 0) updateUI(parseFloat(data[0].lat), parseFloat(data[0].lon), q);
  } catch(e) {}
}

function locateUser() {
  navigator.geolocation.getCurrentPosition(p => {
    updateUI(p.coords.latitude, p.coords.longitude, "現在地");
  });
}

map.on('click', function(e) {
  const { lat, lng } = e.latlng;
  const label = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  updateUI(lat, lng, label);
});
